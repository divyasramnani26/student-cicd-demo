name: Student Placement ML CI-CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:

  test:
    name: CI - Validate and Test ML Model
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate Dataset
        run: |
          python train.py

      - name: Check Model File
        run: |
          if [ ! -f model.pkl ]; then
            echo "ERROR: model.pkl was not generated."
            exit 1
          fi
          echo "model.pkl exists."

      - name: Run Automated Tests
        run: |
          pytest
      - name: Code Quality Check
        run: |
          flake8 train.py predict.py test_model.py
          
      - name: Test Prediction
        run: |
          python -c "import pickle; model=pickle.load(open('model.pkl','rb')); prediction=model.predict([[8.5,92,85,3,1]]); print('Prediction:', prediction[0]); assert prediction[0] in [0,1]"

      - name: Check Model Accuracy
        run: |
          python -c "import pandas as pd; from sklearn.model_selection import train_test_split; from sklearn.ensemble import RandomForestClassifier; from sklearn.metrics import accuracy_score; data=pd.read_csv('data/student_placement.csv'); X=data[['CGPA','Attendance','CodingScore','Projects','Internship']]; y=data['Placement']; X_train,X_test,y_train,y_test=train_test_split(X,y,test_size=0.25,random_state=42,stratify=y); model=RandomForestClassifier(n_estimators=100,random_state=42); model.fit(X_train,y_train); accuracy=accuracy_score(y_test,model.predict(X_test)); print('Accuracy:',accuracy); assert accuracy >= 0.80, f'Accuracy below 80%: {accuracy}'"


  deploy:
    name: CD - Deploy Application
    needs: test
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Deploy Application
        run: |
          echo "Student Placement Prediction Application deployed successfully!"